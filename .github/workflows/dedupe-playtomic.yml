name: Dedupe Playtomic venues

on:
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create .env file from secret
        run: echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      - name: Install dependencies
        run: make setup

      - name: Run Playtomic dedupe
        env:
          ENV: prod
        run: python scripts/dedupe_playtomic_venues.py --apply
