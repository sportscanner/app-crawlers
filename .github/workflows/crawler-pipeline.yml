name: Run Crawler Pipeline

on:
  workflow_dispatch:  # Allows you to manually trigger the workflow if needed

# One external cron trigger starts every sport as its own parallel job. The old
# `needs:` chain made badminton -> squash -> pickleball -> padel -> tennis, so a
# slow sport delayed every sport after it.
#
# Each matrix job now has its own concurrency group. The next 15-minute trigger
# cancels the previous run of the same sport only; it cannot cancel another
# sport's in-flight crawl. `fail-fast: false` keeps the remaining sports running
# if one provider fails.
#
# Each crawler container is capped at two database connections. Aiven allows 20
# total, and five parallel crawlers plus the API must stay below that.
jobs:
  crawl:
    name: "${{ matrix.sport }} crawler"
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sport: [badminton, squash, pickleball, padel, tennis]
    concurrency:
      group: crawler-${{ matrix.sport }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker and log in to GitHub Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Write Firebase JSON secret to file
        run: |
          echo "${{ secrets.FIREBASE_ADMIN_SDK_JSON }}" > /tmp/sportscanner-firebase-adminsdk.json

      - name: Create .env file from secret
        run: |
          echo "${{ secrets.ENV_FILE_CONTENT }}" > .env  # Store the content of your .env file in the secret "ENV_FILE_CONTENT"

      - name: Run crawler pipeline container
        run: |
          echo "Running container for image (tag: latest) to crawl ${{ matrix.sport }}"
          docker run --rm --platform=linux/amd64 --network=host --env-file .env \
            -e DB_POOL_SIZE=1 \
            -e DB_MAX_OVERFLOW=1 \
            -v /tmp/sportscanner-firebase-adminsdk.json:/app/sportscanner-firebase-adminsdk.json \
            ghcr.io/sportscanner/app-crawlers:latest \
            python sportscanner/crawlers/pipeline.py --task ${{ matrix.sport }}

  update-heartbeat-monitor:
    needs: crawl
    runs-on: ubuntu-latest
    steps:
      - name: Update heartbeat monitor
        run: |
          if [ -n "${{ secrets.CRAWLER_CRONJOB_HEARTBEAT }}" ]; then
            curl -fsS "${{ secrets.CRAWLER_CRONJOB_HEARTBEAT }}"
          else
            echo "CRAWLER_CRONJOB_HEARTBEAT not set"
          fi
